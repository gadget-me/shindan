<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホ・パソコンぴったり診断｜家電売り場のメモ帳</title>
  <meta name="description" content="いくつかの質問に答えるだけで、スマホ100機種以上・パソコン40機種以上から、あなたにぴったりの1台を家電量販店スタッフの視点で診断します。">
  <!-- SNS でシェアされたときの表示 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="スマホ・パソコンぴったり診断｜家電売り場のメモ帳">
  <meta property="og:description" content="質問に答えるだけで、あなたにぴったりのスマホ・パソコンを診断。">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="card">

    <!-- ① スタート画面：ジャンルを選ぶ -->
    <section id="start-screen" class="screen">
      <p class="label">家電売り場のメモ帳</p>
      <h1>あなたにぴったりの<br>スマホ・パソコンを診断</h1>
      <p class="lead">いくつかの質問に答えるだけ。<br>家電量販店スタッフの視点でおすすめを出します。</p>
      <div id="genre-buttons" class="choices">
        <!-- ここにジャンルのボタンが app.js から入る -->
      </div>
    </section>

    <!-- ② 質問画面 -->
    <section id="question-screen" class="screen hidden">
      <p id="progress" class="label"></p>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <h2 id="question-text"></h2>
      <div id="answer-buttons" class="choices">
        <!-- ここに答えのボタンが app.js から入る -->
      </div>
      <button id="back-button" class="text-button">← ひとつ前に戻る</button>
    </section>

    <!-- ③ 結果画面 -->
    <section id="result-screen" class="screen hidden">
      <p class="label">あなたにおすすめなのは…</p>
      <h1 id="result-name"></h1>
      <p id="result-description" class="lead"></p>
      <div id="result-specs" class="specs hidden"></div>
      <div id="result-others" class="others hidden"></div>
      <a id="result-link" class="main-button" target="_blank" rel="noopener">くわしく見る</a>
      <button id="retry-button" class="sub-button">最初からやり直す</button>
    </section>

  </main>

  <footer>
    <a href="https://note.com/gadget_me" target="_blank" rel="noopener">note「家電売り場のメモ帳」</a>
    <p class="disclaimer">
      価格とスペックは2026年11月時点で、メーカー公式サイト・価格.comなどをもとに調べたものです。
      最新の情報は、購入前にメーカーや販売店で確認してください。<br>
      この診断は個人が作ったもので、特定のメーカーや販売店とは関係ありません。
    </p>
  </footer>

  <!-- ファイルを直したら、下の ?v= の数字を1つ上げる（ブラウザに古いファイルを使わせないため） -->
  <script src="chips.js?v=3"></script>
  <script src="makers.js?v=3"></script>
  <script src="models.js?v=3"></script>
  <script src="scoring.js?v=3"></script>
  <script src="pc_parts.js?v=3"></script>
  <script src="pc_makers.js?v=3"></script>
  <script src="pc_models.js?v=3"></script>
  <script src="pc_scoring.js?v=3"></script>
  <script src="questions.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
